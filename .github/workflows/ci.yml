name: CI Ronda 3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: saludo-app

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Instalar dependencias de test
        working-directory: src
        run: pip install -r requirements-dev.txt

      - name: Correr tests
        working-directory: src
        run: pytest -v

  secrets-scan:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular tag
        id: tag
        run: |
          export TAG="1.0.${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build imagen
        run: docker build -t $IMAGE:$TAG .

      - name: Probar imagen
        run: docker run --rm $IMAGE:$TAG

  scan:
    name: Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Escanear imagen
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'

  publish:
    name: Publicar en GHCR
    runs-on: ubuntu-latest
    needs: [build, scan, secrets-scan]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
